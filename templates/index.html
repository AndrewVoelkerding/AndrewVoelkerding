<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ data.name }} | Mechanical Engineering</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-dark: #0F172A;
            --text-muted: #475569;
            --border: #E2E8F0;
            --accent-grey: #334155;
            --accent-light: #F1F5F9;
            --purdue-gold: #C59B27;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', sans-serif; 
        }
        
        /* INCREASED GLOBAL BASE FONT SIZE for consistency with projects page */
        body { 
            background-color: var(--bg-main); 
            color: var(--text-dark); 
            line-height: 1.7; 
            font-size: 1.05rem; 
        }

        nav {
            background-color: #0F172A;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--purdue-gold);
        }

        nav .logo { 
            color: white; 
            font-weight: 700; 
            text-decoration: none; 
            font-size: 1.3rem; 
        }
        nav .nav-links { 
            display: flex; 
            gap: 1rem; 
        }
        nav .nav-links a { 
            color: #94A3B8; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 1rem; 
            padding: 0.3rem 0.75rem; 
            border-radius: 4px; 
            transition: all 0.2s; 
        }
        nav .nav-links a:hover, nav .nav-links a.active { 
            color: white; 
            background: #1E293B; 
        }

        header {
            background-color: #0F172A;
            color: white;
            padding: 3.5rem 2rem;
            text-align: center;
        }

        header h1 { 
            font-size: 2.6rem; 
            font-weight: 700; 
            letter-spacing: -0.02em; 
        }
        header p.subtitle { 
            font-size: 1.25rem; 
            color: #94A3B8; 
            margin-top: 0.5rem; 
        }

        .contact-links {
            margin-top: 1.25rem;
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 0.5rem 1.1rem;
            background: #1E293B;
            color: #E2E8F0;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }

        .btn:hover { 
            background: var(--purdue-gold); 
            color: #0F172A; 
            border-color: var(--purdue-gold); 
        }

        .container { 
            max-width: 1250px; /* Matching the wider widescreen layout */
            margin: 0 auto; 
            padding: 2.5rem 1.5rem; 
        }
        
        section { margin-bottom: 3rem; }

        h2.section-title {
            font-size: 1.5rem;
            color: var(--accent-grey);
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.4rem;
            margin-bottom: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 1.5rem; 
        }
